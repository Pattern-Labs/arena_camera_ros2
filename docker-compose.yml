services:
  lucid_driver:
    image: arena_camera_ros2-lucid_driver
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    #entrypoint: "sleep infinity"
    entrypoint: [ "/bin/bash", "-c", " source /opt/ros/eloquent/setup.bash && source ./install/setup.bash && ros2 run arena_camera_node start --ros-args -p binning_selector:=Sensor -p binning_horizontal:=2 -p binning_vertical:=2 -p width:=2280 -p height:=1140" ]
